name: Build Pinas Paupa APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Fix main.dart and Adopt Flutter
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name pinas_paupa
          mkdir -p lib
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          void main()=>runApp(const MyApp());
          class MyApp extends StatelessWidget{
            const MyApp({super.key});
            @override Widget build(BuildContext c){
              return MaterialApp(
                debugShowCheckedModeBanner:false,
                home: Scaffold(
                  appBar:AppBar(title:const Text('Pinas Paupa'),backgroundColor:const Color(0xFF1A8E3E)),
                  body:const Center(child:Column(mainAxisAlignment:MainAxisAlignment.center,children:[
                    Icon(Icons.check_circle,size:80,color:Color(0xFF1A8E3E)),
                    SizedBox(height:10),
                    Text('Pinas Paupa - GREEN NA!',style:TextStyle(fontSize:20,fontWeight:FontWeight.bold)),
                  ])),
                ),
              );
            }
          }
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
